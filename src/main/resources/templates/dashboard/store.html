<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<link href="css/dashboard.css" rel="stylesheet">
	<title>書店員ダッシュボード | IBIS</title>
</head>

	<header th:replace="~{common/store_header :: page_header}"></header>

	営業状態：<span>[[${dashboardInfo.storeStatus.getStoreStatus}]]</span>
	
	<table border="1" >
		<tr><th>承認ステータス</th><th>書籍名</th><th>最終更新日時</th><th>提案日時</th></tr>
		<tr th:each="summary : ${dashboardInfo.bookEditProposalSummaries}" th:object="${summary}">
			<td>[[*{proposalStatus.getProposalStatus}]]</td>
			<td>[[*{bookTitle}]]</td>
			<td>[[*{#temporals.format(updatedAt, 'yyyy/MM/dd HH:mm:ss')}]]</td>	
			<td>[[*{#temporals.format(proposedAt, 'yyyy/MM/dd HH:mm:ss')}]]</td>	
			<td><a href="#">詳細</a></td>
		</tr>
		
	</table>



<body>

	<script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
