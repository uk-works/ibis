<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link href="../css/bootstrap.min.css" rel="stylesheet">
	<link href="../css/common_header.css" rel="stylesheet">
	<title>取扱書籍管理 | IBIS</title>
</head>

<header th:replace="~{common/admin_header :: page_header}"></header>

<body>

	<p>取扱書籍検索</p>
	<form th:action="@{/book/list}" method="get">
		<input type="text" name="keyword"/>
		<input type="submit" value="検索"/>
	</form>
	
	<p>取扱書籍一覧</p>
	
	<!-- ページネーション-->
	<div th:if="${totalPages >= 2}" class="container">
		<ul class="pagination">
			<!-- 前ページへ -->
			<th:block th:switch="${page}">
				<li th:case="1" class="page-item disabled">
					<a class="page-link" href="">&laquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/book/list(page=${page - 1})}">&laquo;</a>
				</li>
			</th:block>
			
			<!-- ページ番号 -->
			<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
				<th:block th:switch="${index}">
					<li th:case="${page}" class="page-item active">
						<a class="page-link" href="">[[${index}]]</a>
					</li>
					<li th:case="*" class="page-item">
						<a class="page-link" th:href="@{/book/list(page=${index})}">[[${index}]]</a>
					</li>
				</th:block>
			</th:block>
			
			<!-- 次ページへ -->
			<th:block th:switch="${page}">
				<li th:case="${totalPages}" class="page-item disabled">
					<a class="page-link" href="">&raquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/book/list(page=${page + 1})}">&raquo;</a>
				</li>
			</th:block>
		</ul>
	</div>
	
	
	
	<a class="button" th:href="@{/book/create}">登録</a>

	<table border="1" >
		<tr><th>書籍名</th><th>著者</th><th>出版社</th><th>発行日</th><th>ISBN</th></tr>
		<tr th:each="summary : ${books}" th:object="${summary}">
			<td>[[*{bookTitle}]]</td>
			<td>[[*{author}]]</td>
			<td>[[*{publisherName}]]</td>
			<td>[[*{#temporals.format(releaseDate, 'yyyy/MM/dd')}]]</td>
			<td>[[*{isbn}]]</td>
			<td><a href="#">編集</a></td>
		</tr>
	</table>
	
	<script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
