<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link th:href="@{../css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{../css/common_header.css}" rel="stylesheet">
	<title>書籍管理 | IBIS</title>
</head>

<header th:replace="~{common/admin_header :: page_header}"></header>

<body>
	<div class="container mt-4">
		<!-- タイトル -->
		<h2 class="mb-4">書籍検索</h2>

		<!-- 検索エリア -->
		<div class="mb-4">
			<div>
				<form class="row g-3 align-items-center" th:action="@{/book/list}" method="get">
					<!-- 検索ボックス -->
					<div class="col-md-4">
						<input type="text" class="form-control" name="keyword" />
					</div>
					<!-- 検索ボタン -->
					<div class="col-md-1 d-grid">
						<button class="btn btn-primary">検索</button>
					</div>
				</form>
			</div>
		</div>

		<div th:if="${isSuccess} == true" class="mb-4 alert alert-success">
			[[${msg}]]
		</div>

		<div th:if="${isSuccess} == false" class="mb-4 alert alert-danger">
			[[${msg}]]
		</div>
		
		<div class="d-flex justify-content-between align-items-center mb-2">
			<h2>書籍一覧</h2>

			<!-- ページネーション-->
			<div th:if="${totalPages >= 2}">
				<ul class="pagination">
					<!-- 前ページへ -->
					<th:block th:switch="${page}">
						<li th:case="1" class="page-item disabled">
							<a class="page-link" href="">&laquo;</a>
						</li>
						<li th:case="*" class="page-item">
							<a class="page-link" th:href="@{/book/list(page=${page - 1}, keyword=${keyword})}">&laquo;</a>
						</li>
					</th:block>

					<!-- ページ番号 -->
					<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
						<th:block th:switch="${index}">
							<li th:case="${page}" class="page-item active">
								<a class="page-link" href="">[[${index}]]</a>
							</li>
							<li th:case="*" class="page-item">
								<a class="page-link" th:href="@{/book/list(page=${index}, keyword=${keyword})}">[[${index}]]</a>
							</li>
						</th:block>
					</th:block>

					<!-- 次ページへ -->
					<th:block th:switch="${page}">
						<li th:case="${totalPages}" class="page-item disabled">
							<a class="page-link" href="">&raquo;</a>
						</li>
						<li th:case="*" class="page-item">
							<a class="page-link" th:href="@{/book/list(page=${page + 1}, keyword=${keyword})}">&raquo;</a>
						</li>
					</th:block>
				</ul>
			</div><!-- ページネーション 終 -->

			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn-primary" th:onclick="|location.href='@{/book/create}'|">登録</button>
			</div>
		</div>

		<table border="1" class="table table-striped">
			<thead>
				<tr>
					<th>書籍名</th>
					<th>著者</th>
					<th>出版社</th>
					<th>発行日</th>
					<th>ISBN</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="summary : ${books}" th:object="${summary}">
					<td>[[*{bookTitle}]]</td>
					<td>[[*{author}]]</td>
					<td>[[*{publisherName}]]</td>
					<td>[[*{#temporals.format(releaseDate, 'yyyy/MM/dd')}]]</td>
					<td>[[*{isbn}]]</td>
					<td>
						<button type="button" class="btn btn-secondary"
							th:onclick="|location.href='@{/book/edit/{bookId}(bookId=*{bookId})}'|">編集</button>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="d-flex justify-content-center  mt-3">

			<!-- ページネーション-->
			<div th:if="${totalPages >= 2}">
				<ul class="pagination">
					<!-- 前ページへ -->
					<th:block th:switch="${page}">
						<li th:case="1" class="page-item disabled">
							<a class="page-link" href="">&laquo;</a>
						</li>
						<li th:case="*" class="page-item">
							<a class="page-link" th:href="@{/book/list(page=${page - 1}, keyword=${keyword})}">&laquo;</a>
						</li>
					</th:block>

					<!-- ページ番号 -->
					<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
						<th:block th:switch="${index}">
							<li th:case="${page}" class="page-item active">
								<a class="page-link" href="">[[${index}]]</a>
							</li>
							<li th:case="*" class="page-item">
								<a class="page-link" th:href="@{/book/list(page=${index}, keyword=${keyword})}">[[${index}]]</a>
							</li>
						</th:block>
					</th:block>

					<!-- 次ページへ -->
					<th:block th:switch="${page}">
						<li th:case="${totalPages}" class="page-item disabled">
							<a class="page-link" href="">&raquo;</a>
						</li>
						<li th:case="*" class="page-item">
							<a class="page-link" th:href="@{/book/list(page=${page + 1}, keyword=${keyword})}">&raquo;</a>
						</li>
					</th:block>
				</ul>
			</div><!-- ページネーション 終 -->
		</div>
	</div><!-- .container mt-4 -->

	<script th:src="@{../js/bootstrap.bundle.min.js}"></script>
</body>

</html>
