<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link href="../css/bootstrap.min.css" rel="stylesheet">
	<link href="../css/common_header.css" rel="stylesheet">
	<title>[画面名] | IBIS</title>
</head>

<header th:replace="~{common/admin_header :: page_header}"></header>
<body>

	<p>書籍登録</p>
	
	<form th:action="@{/book/create}" method="post">
		<button>登録</button>
		<button>戻る</button>
		<label>ISBN<input type="text" name="isbn" /></label>
		<label>JANコード<input type="text" name="isbn" /></label>
		<label>書籍名<input type="text" name="isbn" /></label>
		<label>Cコード<input type="text" name="isbn" /></label>
		<label>ジャンル名
			<select name="genre">
				<option value="1">例：文学</option>
				<option value="2">例：SF</option>
			</select>
		</label>
		<label>著者<input type="text" name="isbn" /></label>
		<label>出版社
			<select name="publisher">
				<option value="1">例：株式会社講談社</option>
				<option value="2">例：株式会社技術評論社</option>
			</select>
		</label>
		<label>出版社（その他）<input type="text" name="isbn" /></label>
		<label>サイズ
			<select name="book-size">
				<option value="1">例：単行本</option>
				<option value="2">例：大型本</option>
			</select>
		</label>
		<label>定価<input type="text" name="isbn" /></label>
		<label>版<input type="text" name="isbn" /></label>
		<label>発売日<input type="text" name="isbn" /></label>

	
		<label>書店
			<select name="store">
				<option value="1">例：こもれび書店</option>
				<option value="2">例：さわや書店</option>
			</select>
		</label>
		<label>書店ジャンル<input type="text" name="isbn" /></label>
		<label>店頭価格<input type="text" name="isbn" /></label>
		<label>紹介文<input type="text" name="isbn" /></label>
		<label>備考<input type="text" name="isbn" /></label>	
		</form>
	
	<script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
