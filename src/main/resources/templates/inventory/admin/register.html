<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link th:href="@{../../css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{../../css/common_header.css}" rel="stylesheet">
	<title>在庫登録 | IBIS</title>
</head>
<header th:replace="~{common/admin_header :: page_header}"></header>

<body>

	<main class="container mt-4">
		<h2 class="mb-4">在庫登録</h2>

		<form th:action="@{/inventory/create}" method="post" th:object="${inventoryRequest}">

			<div class="row justify-content-center align-items-center mb-2">
				<label for="storeId" class="col-md-2 col-form-label">書店</label>
				<div class="col-md-7">
					<select class="form-select" id="storeSelect" th:field="*{storeId}">
						<option th:each="store : ${storeOptions}" th:value="${store.storeId}">[[${store.storeName}]]
						</option>
					</select>
				</div>

			</div>

			<div class="row justify-content-center align-items-center mb-2">
				<label for="bookId" class="col-md-2 col-form-label">書籍</label>
				<div class="col-md-7">
					<select class="form-select" id="bookSelect" th:field="*{bookId}">
						<option th:value="1"></option>
					</select>
				</div>
			</div>


			<div class="row justify-content-center align-items-center mb-2">
				<label for="amount" class="col-md-2 col-form-label">在庫数</label>
				<div class="col-md-7">
					<input type="number" class="form-control" th:field="*{amount}" />				
					<p th:errors="*{amount}"></p>
				</div>
			</div>

			<div class="row justify-content-center align-items-center gap-5">
				<div class="col-auto">
					<button class="btn btn-primary btn-lg">登録</button>
				</div>
				<div class="col-auto">
					<button type="button" class="btn btn-secondary btn-lg"
						onclick="location.href='/inventory/list'">戻る</button>
				</div>
			</div>
		</form>
	</main>




	<script th:src="@{../../js/bootstrap.bundle.min.js}"></script>
	<script th:inline="javascript">
		const bookOptions = /*[[${bookOptions}]]*/[];
		const select = document.getElementById("storeSelect");


		function update() {
			const storeId = select.value;
			const data = bookOptions.filter(
				book => book.storeId === storeId
			);
			
			const bookSelect = document.getElementById("bookSelect");

			// 一旦中身を空にする
			bookSelect.innerHTML = "";

			// option生成
			data.forEach(book => {

				const option = document.createElement("option");

				option.value = book.bookId;
				option.textContent = book.bookTitle;

				bookSelect.appendChild(option);

			});

		}

		// 変更時
		select.addEventListener("change", update);

		// 初期表示
		document.addEventListener("DOMContentLoaded", update);
	</script>
</body>

</html>
