<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link href="../../css/bootstrap.min.css" rel="stylesheet">
	<link href="../css/common_header.css" rel="stylesheet">
	<title>在庫管理 | IBIS</title>
</head>

<header th:replace="~{common/admin_header :: page_header}"></header>

<body>
	在庫検索
	<form th:action="@{/inventory/list}" method="get">
		<input type="text" name="keyword" />
		<input type="submit" value="検索" />
	</form>

	在庫一覧
	<!-- ページネーション-->
	<div th:if="${totalPages >= 2}" class="container">
		<ul class="pagination">
			<!-- 前ページへ -->
			<th:block th:switch="${page}">
				<li th:case="1" class="page-item disabled">
					<a class="page-link" href="">&laquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/inventory/list(page=${page - 1})}">&laquo;</a>
				</li>
			</th:block>

			<!-- ページ番号 -->
			<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
				<th:block th:switch="${index}">
					<li th:case="${page}" class="page-item active">
						<a class="page-link" href="">[[${index}]]</a>
					</li>
					<li th:case="*" class="page-item">
						<a class="page-link" th:href="@{/inventory/list(page=${index})}">[[${index}]]</a>
					</li>
				</th:block>
			</th:block>

			<!-- 次ページへ -->
			<th:block th:switch="${page}">
				<li th:case="${totalPages}" class="page-item disabled">
					<a class="page-link" href="">&raquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/inventory/list(page=${page + 1})}">&raquo;</a>
				</li>
			</th:block>
		</ul>
	</div>

	<a class="button" th:href="@{/inventory/create}">登録</a>
	<table border="1">
		<!-- 1店舗ごとのまとまりをループ -->
		<th:block th:each="storeInventory : ${storeInventoryResponse.storeInventories}" th:object="${storeInventory}">

			<!-- 店舗名セクション（1行使って目立たせる） -->
			<thead style="background-color: #eee;">
				<tr>
					<th colspan="5" th:text="'店舗名：' + *{storeName}"></th>
				</tr>
				<tr>
					<th>書籍名</th>
					<th>在庫数</th>
					<th>在庫状態</th>
					<th>更新日時</th>
					<th>アクション</th>
				</tr>
			</thead>

			<!-- その店舗に紐づく在庫リストをループ -->
			<tbody>
				<tr th:each="summary : *{inventorySummaries}">
					<td th:text="${summary.bookTitle}"></td>
					<td th:text="${summary.amount}"></td>
					<!-- Enumのメソッド呼び出しはプロパティ形式かカッコありで -->
					<td th:text="${summary.inventoryStatus.getLabel}"></td>
					<td th:text="${#temporals.format(summary.updatedAt, 'yyyy/MM/dd')}"></td>
					<td>
						<!--	                    <a th:href="@{/inventory/edit/{id}(id=${summary.bookId})}">編集</a>-->
						<button type="button" class="btn btn-primary inventoryEditButton" data-bs-toggle="modal"
							th:data-store-id="${summary.storeId}" th:data-book-id="${summary.bookId}"
							data-bs-target="#editModal">
							編集
						</button>
						<a th:href="@{#}">削除</a>
					</td>
				</tr>
				<!-- 店舗間の区切りとして少しスペースを空ける行（任意） -->
				<tr style="height: 10px; border: none;">
					<td colspan="5" style="border: none;"></td>
				</tr>
			</tbody>

		</th:block>
	</table>

	<!-- ページネーション-->
	<div th:if="${totalPages >= 2}" class="container">
		<ul class="pagination">
			<!-- 前ページへ -->
			<th:block th:switch="${page}">
				<li th:case="1" class="page-item disabled">
					<a class="page-link" href="">&laquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/inventory/list(page=${page - 1})}">&laquo;</a>
				</li>
			</th:block>

			<!-- ページ番号 -->
			<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
				<th:block th:switch="${index}">
					<li th:case="${page}" class="page-item active">
						<a class="page-link" href="">[[${index}]]</a>
					</li>
					<li th:case="*" class="page-item">
						<a class="page-link" th:href="@{/inventory/list(page=${index})}">[[${index}]]</a>
					</li>
				</th:block>
			</th:block>

			<!-- 次ページへ -->
			<th:block th:switch="${page}">
				<li th:case="${totalPages}" class="page-item disabled">
					<a class="page-link" href="">&raquo;</a>
				</li>
				<li th:case="*" class="page-item">
					<a class="page-link" th:href="@{/inventory/list(page=${page + 1})}">&raquo;</a>
				</li>
			</th:block>
		</ul>
	</div>

	<script src="js/bootstrap.bundle.min.js"></script>
	<!-- Button trigger modal -->


	<!-- Modal -->
	<div class="modal fade" id="editModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
		aria-labelledby="staticBackdropLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">

					<div class="modal-header">

						<h1 class="modal-title fs-5" id="staticBackdropLabel">在庫編集</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>

					<form id="editForm" th:action="@{/inventory/edit}" method="post">
						<input type="hidden" name="storeId" id="storeIdInput">
						<input type="hidden" name="bookId" id="bookIdInput">

						<div class="modal-body">
							<p>以下の在庫情報を編集できます。<br>
								変更後、「完了」ボタンを押してください。</p>
							<p>書店名：<span id="storeName"></span></p>
							<p>書籍名：<span id="bookTitle"></span></p>
							<p>在庫数：<input type="number" name="amount" id="amountInput" /></p>
							<div id="inventoryStatusArea" style="display:none;">
								<p>
									在庫数が0のとき、在庫の状態を以下の項目から選択
								</p>
								<label>
									在庫状態
									<select name="inventoryStatus" id="inventoryStatusInput">
										<option value="ACTIVE">
											販売中
										</option>

										<option value="RESTOCK_PLANNED">
											再入荷予定あり
										</option>

										<option value="RESTOCK_UNDECIDED">
											再入荷未定
										</option>

										<option value="DISCONTINUED">
											取扱休止
										</option>
									</select>
								</label>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" id="editButton" class="btn btn-primary">完了</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
						</div>
					</form>
			</div>
		</div>
	</div>

	<script th:src="@{../../js/bootstrap.bundle.min.js}"></script>
	<script th:inline="javascript">
		const storeInventories = /*[[${storeInventoryResponse.storeInventories}]]*/[];

		document.querySelectorAll(".inventoryEditButton").forEach(button => {

			button.addEventListener("click", () => {

				
				const storeId = button.dataset.storeId;
				const bookId = button.dataset.bookId;

				const storeInventory = storeInventories.find((sis) => sis.storeId === storeId);

				const inventorySummary = storeInventory.inventorySummaries.find((si) => si.bookId === bookId);

				document.getElementById("storeName").textContent = storeInventory.storeName;
			
				document.getElementById("bookTitle").textContent = inventorySummary.bookTitle;
				
				document.getElementById("storeIdInput").value
				    = storeId;

				document.getElementById("bookIdInput").value
				    = bookId;

				document.getElementById("amountInput").value
				    = inventorySummary.amount;

				document.getElementById("inventoryStatusInput").value
				    = inventorySummary.inventoryStatus;
					
				updateInventoryStatusVisibility();
			});
		});
		
		const editButton =
		    document.getElementById("editButton");

		const editForm =
		    document.getElementById("editForm");

		editButton.addEventListener("click", () => {

		    editForm.submit();

		});
		
		/* ============================================================ */
		const amountInput =
			document.getElementById("amountInput");

		const inventoryStatusArea =
			document.getElementById("inventoryStatusArea");

		function updateInventoryStatusVisibility() {

			const value = amountInput.value;

			if (value !== "" && Number(value) >= 1) {

			    inventoryStatusInput.value = "ACTIVE";

			    inventoryStatusArea.style.display = "none";

			} else if (value !== "" && Number(value) === 0) {
			    inventoryStatusArea.style.display = "block";
			} else {
			    inventoryStatusArea.style.display = "none";
			}
		}

		amountInput.addEventListener(
			"input",
			updateInventoryStatusVisibility
		);


	</script>
</body>

</html>
