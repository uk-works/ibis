<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=devide-width, initial-scale=1.0" />
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<title>書店登録 | IBIS</title>
</head>

<body>

	<p>書店登録</p>
	
	<form th:action="@{/store/create}" method="post" th:object="${storeCreateRequest}">
		<button>登録</button>
		<button type="button" onclick="location.href='/auth/login'">戻る</button>

		<p th:errors="*{loginId}"></p>
		<label>ID<input type="text" th:field="*{loginId}" /></label>
		
		<p th:errors="*{password}"></p>
		<label>パスワード<input type="password" th:field="*{password}" /></label>

		<p th:errors="*{storeName}"></p>
		<label>書店名<input type="text" th:field="*{storeName}" /></label>

		<p th:errors="*{email}"></p>
		<label>メールアドレス<input type="email" th:field="*{email}" /></label>

		<p th:errors="*{tel}"></p>
		<label>電話番号<input type="text" th:field="*{tel}" /></label>

		<p th:errors="*{postalCode}"></p>
		<label>郵便番号<input type="text" th:field="*{postalCode}" /></label>
		
		<p th:errors="*{address}"></p>
		<label>住所<input type="text" th:field="*{address}" /></label>
		
		<p th:errors="*{openingHours}"></p>
		<label>営業時間<input type="text" th:field="*{openingHours}" /></label>
		
		<p th:errors="*{closedDays}"></p>
		<label>定休日<input type="text" th:field="*{closedDays}" /></label>

		<label>書店営業状態
			<select th:field="*{storeStatus}">
				<option th:each="status : ${storeStatuses}" th:value="${status}">
					[[${status.label}]]
				</option>
			</select>
		</label>
		
		<label>備考<input type="text" th:field="*{note}" /></label>
	</form>
	
	
	<script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
